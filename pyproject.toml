[project]
name = "peruvian-wave-analysis"
version = "0.1.0"
description = "Análisis de oleaje extremo y contornos ambientales Hs–Tp a partir de WAVERYS (Copernicus Marine)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.6",
    "netcdf4>=1.7",
    "matplotlib>=3.9",
    "contourpy>=1.2",
    "scipy>=1.13",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "truststore>=0.10",
    "copernicusmarine>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[project.scripts]
mapa-sitio = "peruvian_wave_analysis.sitio.cli:main"
mapa-sitio-final = "peruvian_wave_analysis.sitio.cli:main_final"
registrar-gebco = "peruvian_wave_analysis.sitio.cli:main_registrar_gebco"
serie-waverys = "peruvian_wave_analysis.sitio.cli:main_serie"
ficha-sitio = "peruvian_wave_analysis.sitio.ficha:main"
verificacion-f2 = "peruvian_wave_analysis.verificacion.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peruvian_wave_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "red: descarga datos de servicios externos; excluir con -m \"not red\"",
    "lento: tarda más de un minuto; excluir con -m \"not lento\"",
]
